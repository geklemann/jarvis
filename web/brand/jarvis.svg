<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Jarvis</title>
  <!-- Ícone no estilo Studio: grafite, "J" branco de traço preciso e um único ponto azul de destaque. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2028"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="ponto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f93ff"/>
      <stop offset="1" stop-color="#3d68e6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>
  <g transform="translate(12 -10)">
    <path d="M292 150 V292 A92 92 0 0 1 108 292" fill="none" stroke="#f4f5f7" stroke-width="72"/>
    <rect x="352" y="114" width="64" height="64" rx="18" fill="url(#ponto)"/>
  </g>
</svg>
