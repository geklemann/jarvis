# Configuração usada pelo Supabase CLI (deploy pelo GitHub Actions).
project_id = "concil-ia"

[functions.ai-assistant]
verify_jwt = true

# Valida o usuário por conta própria (JWT) ou pelo CRON_SECRET na sincronização agendada.
[functions.integrations]
verify_jwt = false

# Retorno do OAuth das plataformas: público, protegido pelo "state" assinado.
[functions.oauth-callback]
verify_jwt = false

[auth]
site_url = "https://jaarvis.com.br/"
# Cadastro aberto com aprovação: a conta nova vira um pedido de acesso e o dono libera em Integrações › Equipe (workspaces.recebe_solicitacoes).
enable_signup = true
additional_redirect_urls = ["https://jaarvis.com.br/**", "https://www.jaarvis.com.br/**", "https://geklemann.github.io/jarvis/**", "https://ecombalance.com.br/**", "https://www.ecombalance.com.br/**", "https://guilhermek-maker.github.io/ecombalance/**", "https://guilhermek-maker.github.io/fechai/**", "https://guilhermek-maker.github.io/concil-ia/**", "http://127.0.0.1:3000/**"]

# Central do Cliente: pública (comprador sem login); protegida por número do pedido + 4 dígitos do CPF.
[functions.portal]
verify_jwt = false

# Jarvis Ponto: app do colaborador (sem login do ERP); identificado por aparelho ativado com código de uso único.
[functions.ponto]
verify_jwt = false
