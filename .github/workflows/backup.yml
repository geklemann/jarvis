name: Backup (Supabase → Cloudflare R2)

# Toda madrugada (03:17 de Brasília): papéis, estrutura e dados do banco + todos os arquivos do Storage, compactados,
# cifrados (AES-256, frase BACKUP_PASSPHRASE) e enviados ao balde R2 "jarvis-backups" pelo receptor
# (ops/receptor-backup, que grava pela ligação interna da Cloudflare, sem chave do R2): diario/AAAA-MM-DD/ e, no dia 1,
# mensal/AAAA-MM/. O envio é conferido baixando de volta e comparando a soma de verificação. No dia 1 de cada mês
# (e quando rodado à mão), o backup é restaurado num banco descartável e as linhas de cada tabela são comparadas com
# o original. Se algo falhar, o GitHub manda e-mail. Ativar ou renovar os segredos: node ops/ativar-backup.mjs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      restaurar:
        description: "Também restaurar num banco de teste e conferir as linhas"
        type: boolean
        default: true

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      POOLER: ${{ vars.SUPABASE_POOLER_HOST }}
      RECEPTOR: ${{ vars.BACKUP_RECEPTOR_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_BACKUP }}
      RECEPTOR_TOKEN: ${{ secrets.RECEPTOR_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Verificar configuração
        id: cfg
        run: |
          for v in PROJECT_REF POOLER RECEPTOR SUPABASE_DB_PASSWORD SUPABASE_SERVICE_KEY RECEPTOR_TOKEN BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::notice::Backup ainda não ativado: falta $v (rode node ops/ativar-backup.mjs)."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "DIA=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "DIA_MES=$(date -u +%d)" >> "$GITHUB_ENV"
          echo "MES=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 24

      - name: Banco (papéis, estrutura e dados)
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          SENHA=$(node -e "process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))")
          echo "::add-mask::$SENHA"
          URL="postgresql://postgres.$PROJECT_REF:$SENHA@$POOLER:5432/postgres"
          mkdir -p bk/banco bk/arquivos
          supabase db dump --db-url "$URL" --role-only -f bk/banco/roles.sql
          supabase db dump --db-url "$URL" -f bk/banco/schema.sql
          supabase db dump --db-url "$URL" --data-only --use-copy -f bk/banco/data.sql
          node ops/backup-contagem.mjs contar bk/banco/data.sql > bk/contagem.json
          node -e "const c=require('./bk/contagem.json');console.log('Banco: '+Object.keys(c).length+' tabelas, '+Object.values(c).reduce((s,n)=>s+n,0)+' linhas')"

      - name: Arquivos (Storage)
        if: steps.cfg.outputs.ok == 'true'
        env:
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
        run: node ops/backup-storage.mjs bk/arquivos

      - name: Compactar e cifrar
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          tar -C bk -czf "jarvis-$DIA.tar.gz" .
          sha256sum "jarvis-$DIA.tar.gz" | cut -d' ' -f1 > sha.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "jarvis-$DIA.tar.gz" -out "jarvis-$DIA.tar.gz.enc" -pass env:BACKUP_PASSPHRASE
          echo "Backup: $(du -h "jarvis-$DIA.tar.gz.enc" | cut -f1) (cifrado)"

      - name: Enviar ao R2 e conferir
        if: steps.cfg.outputs.ok == 'true'
        run: |
          set -euo pipefail
          AUTH="authorization: Bearer $RECEPTOR_TOKEN"
          enviar() { # $1 arquivo, $2 chave no balde: até 90 MB de uma vez; acima disso, em partes de 50 MB
            local tam; tam=$(stat -c %s "$1")
            if [ "$tam" -le 94371840 ]; then
              curl -fsS -X PUT -H "$AUTH" --data-binary @"$1" "$RECEPTOR/simples?chave=$2" > /dev/null
            else
              local up; up=$(curl -fsS -X POST -H "$AUTH" "$RECEPTOR/iniciar?chave=$2" | jq -r .uploadId)
              rm -rf partes && mkdir partes && split -b 52428800 -d -a 4 "$1" partes/p
              local lista='[' n=0
              for p in partes/p*; do n=$((n+1)); et=$(curl -fsS -X PUT -H "$AUTH" --data-binary @"$p" "$RECEPTOR/parte?chave=$2&uploadId=$up&n=$n" | jq -r .etag); lista="$lista{\"n\":$n,\"etag\":\"$et\"},"; done
              curl -fsS -X POST -H "$AUTH" -H 'content-type: application/json' -d "{\"uploadId\":\"$up\",\"partes\":${lista%,}]}" "$RECEPTOR/concluir?chave=$2" > /dev/null
            fi
          }
          enviar "jarvis-$DIA.tar.gz.enc" "diario/$DIA/jarvis-$DIA.tar.gz.enc"
          enviar bk/contagem.json "diario/$DIA/contagem.json"
          if [ "$DIA_MES" = "01" ]; then enviar "jarvis-$DIA.tar.gz.enc" "mensal/$MES/jarvis-$DIA.tar.gz.enc"; fi
          # Conferência: baixa de volta, decifra e compara com o original.
          curl -fsS -H "$AUTH" -o volta.enc "$RECEPTOR/baixar?chave=diario/$DIA/jarvis-$DIA.tar.gz.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in volta.enc -out volta.tar.gz -pass env:BACKUP_PASSPHRASE
          [ "$(sha256sum volta.tar.gz | cut -d' ' -f1)" = "$(cat sha.txt)" ] || { echo "::error::O backup no R2 não confere com o original."; exit 1; }
          echo "Backup no R2 conferido: diario/$DIA/"

      - name: Restaurar num banco de teste e conferir
        if: steps.cfg.outputs.ok == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.restaurar) || (github.event_name == 'schedule' && env.DIA_MES == '01'))
        run: |
          set -euo pipefail
          supabase db start
          URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$URL" --single-transaction -v ON_ERROR_STOP=1 \
            -f bk/banco/roles.sql -f bk/banco/schema.sql \
            -c 'SET session_replication_role = replica' -f bk/banco/data.sql > restauracao.log
          node ops/backup-contagem.mjs sql bk/contagem.json > contar.sql
          psql "$URL" -At -F $'\t' -f contar.sql > restaurado.tsv
          node ops/backup-contagem.mjs conferir bk/contagem.json restaurado.tsv
